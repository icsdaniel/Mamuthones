name: Android test APK

# Builds a debug-signed APK anyone can sideload for testing, and publishes it on the
# "android-test" pre-release so it can be downloaded straight to a phone.
on:
  push:
    branches: [game-v1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Godot and the Android export templates
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          curl -sSL -o t.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          T="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$T"
          unzip -j -q t.tpz templates/version.txt templates/android_debug.apk templates/android_release.apk templates/android_source.zip -d "$T"
          rm t.tpz
      - name: Point Godot at the Android SDK and a debug keystore
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.6.tres" <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^ *//' "$HOME/.config/godot/editor_settings-4.6.tres"
      - name: Import and export the APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          ./godot --headless --path game --import
          mkdir -p build/android
          ./godot --headless --path game --export-debug "Android APK" ../build/android/mamuthones.apk
          ls -la build/android
          test -s build/android/mamuthones.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mamuthones-apk
          path: build/android/mamuthones.apk
      - name: Publish on the android-test pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test build/android/mamuthones.apk --prerelease \
            --target "$GITHUB_SHA" --title "Android test build" \
            --notes "Debug build of branch game-v1 at ${GITHUB_SHA::7}, for testing. Open this page on your Android phone, download mamuthones.apk and install it (allow installs from your browser when asked)."
